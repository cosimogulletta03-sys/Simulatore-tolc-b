<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simulatore TOLC-B</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a1428">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TOLC-B">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;700;900&family=Source+Serif+4:wght@400;600&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy-950:#050b18; --navy-900:#0a1428; --navy-800:#0f1e3a; --navy-700:#16294d;
    --navy-600:#1e3763; --gold:#d4af6a; --gold-bright:#f0cf8e; --gold-dim:#8a744a;
    --ink:#eef1f6; --ink-dim:#a9b4c8; --green:#5fbf8f; --red:#e07a6b;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; background:
      radial-gradient(1200px 800px at 80% -10%, #142645 0%, transparent 60%),
      linear-gradient(180deg, var(--navy-950), var(--navy-900) 60%, var(--navy-950));
    color:var(--ink); font-family:'Source Serif 4', serif;
  }
  .wrap{max-width:820px; margin:0 auto; padding:28px 18px 60px;}
  h1,h2,h3{font-family:'Fraunces', serif; font-weight:700; letter-spacing:.2px;}
  h1{font-size:1.9rem; color:var(--gold-bright); margin:0 0 4px;}
  .sub{color:var(--ink-dim); margin:0 0 26px; font-size:.98rem;}
  .card{
    background:linear-gradient(180deg, var(--navy-800), var(--navy-900));
    border:1px solid var(--navy-600); border-radius:14px; padding:22px;
    box-shadow:0 10px 30px rgba(0,0,0,.35);
  }
  .grid{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:18px;}
  @media(max-width:560px){.grid{grid-template-columns:1fr;}}
  .opt-btn{
    background:var(--navy-700); border:1px solid var(--navy-600); color:var(--ink);
    border-radius:10px; padding:16px; cursor:pointer; text-align:left; font-family:'Source Serif 4',serif;
    font-size:1rem; transition:.15s; display:flex; gap:10px; align-items:flex-start;
  }
  .opt-btn:hover{border-color:var(--gold-dim); background:var(--navy-600);}
  .opt-btn b{font-family:'JetBrains Mono',monospace; color:var(--gold); flex-shrink:0;}
  .btn{
    background:var(--gold); color:var(--navy-950); border:none; border-radius:10px;
    padding:12px 20px; font-family:'JetBrains Mono',monospace; font-weight:700; cursor:pointer;
    font-size:.92rem; letter-spacing:.3px;
  }
  .btn.secondary{background:transparent; color:var(--gold); border:1px solid var(--gold-dim);}
  .btn:hover{filter:brightness(1.08);}
  .btn:disabled{opacity:.4; cursor:not-allowed;}
  .row{display:flex; gap:10px; flex-wrap:wrap; align-items:center;}
  .pill{
    font-family:'JetBrains Mono',monospace; font-size:.78rem; padding:4px 10px;
    border-radius:20px; border:1px solid var(--navy-600); color:var(--ink-dim);
  }
  .pill.active{border-color:var(--gold); color:var(--gold-bright);}
  .topbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; flex-wrap:wrap; gap:8px;}
  .timer{font-family:'JetBrains Mono',monospace; color:var(--gold-bright); font-size:1.05rem; font-weight:700;}
  .qtext{font-size:1.15rem; line-height:1.5; margin:0 0 4px;}
  .meta{color:var(--ink-dim); font-size:.82rem; font-family:'JetBrains Mono',monospace; margin-bottom:10px;}
  .feedback{margin-top:16px; padding:14px 16px; border-radius:10px; font-size:.96rem; line-height:1.5;}
  .feedback.ok{background:rgba(95,191,143,.12); border:1px solid var(--green); color:#cdeedd;}
  .feedback.ko{background:rgba(224,122,107,.12); border:1px solid var(--red); color:#f5d6d0;}
  .hint-box{margin-top:14px; padding:12px 14px; background:rgba(212,175,106,.08); border:1px dashed var(--gold-dim); border-radius:10px; color:var(--gold-bright); font-size:.9rem;}
  .subj-btn{
    background:var(--navy-700); border:1px solid var(--navy-600); color:var(--ink);
    border-radius:12px; padding:16px; cursor:pointer; text-align:left;
  }
  .subj-btn:hover{border-color:var(--gold-dim);}
  .subj-btn .n{font-family:'JetBrains Mono',monospace; color:var(--gold); font-size:.8rem;}
  .subj-btn .t{font-family:'Fraunces',serif; font-weight:700; font-size:1.05rem; margin-top:4px;}
  .footer-note{color:var(--ink-dim); font-size:.8rem; margin-top:22px; line-height:1.5;}
  .score-big{font-family:'JetBrains Mono',monospace; font-size:2.6rem; color:var(--gold-bright); font-weight:700; text-align:center; margin:8px 0;}
  .bar{height:8px; background:var(--navy-700); border-radius:6px; overflow:hidden; margin:14px 0;}
  .bar > div{height:100%; background:linear-gradient(90deg, var(--gold-dim), var(--gold-bright));}
  a.link{color:var(--gold-bright);}
</style>
</head>
<body>
<div class="wrap">
  <h1>Simulatore TOLC‑B</h1>
  <p class="sub">Domande originali scritte secondo il sillabo ufficiale CISIA 2026 — la banca dati vera è riservata e non pubblica.</p>
  <div id="app" class="card"></div>
  <p class="footer-note" id="footnote"></p>
</div>

<script>
// ===================== BANCA DATI (originale, per sillabo) =====================
const QUIZ_DATA = {
  matematica: [
    {q:"Quanto vale (2/3) + (3/4)?", opts:["17/12","5/7","1/2","23/12"], a:0,
     hint:"Trova il minimo comune multiplo tra 3 e 4.",
     exp:"MCD di 3 e 4 è 12: 8/12 + 9/12 = 17/12."},
    {q:"Se x² − 5x + 6 = 0, quali sono le soluzioni?", opts:["x=1, x=6","x=2, x=3","x=-2, x=-3","x=0, x=5"], a:1,
     hint:"Cerca due numeri che moltiplicati diano 6 e sommati diano 5.",
     exp:"(x−2)(x−3)=0, quindi x=2 oppure x=3."},
    {q:"Un articolo costa 80€ e viene scontato del 15%. Quanto costa dopo lo sconto?", opts:["65€","68€","72€","70€"], a:1,
     hint:"Calcola il 15% di 80 e sottrailo.",
     exp:"15% di 80 = 12. 80 − 12 = 68€."},
    {q:"Quale delle seguenti è la pendenza della retta passante per (1,2) e (3,8)?", opts:["2","3","6","1/3"], a:1,
     hint:"Pendenza = Δy/Δx.",
     exp:"(8−2)/(3−1) = 6/2 = 3."},
    {q:"Log₂(32) è uguale a:", opts:["4","5","6","16"], a:1,
     hint:"Chiediti: 2 elevato a quale numero dà 32?",
     exp:"2⁵ = 32, quindi log₂(32) = 5."},
    {q:"In un triangolo rettangolo i cateti misurano 6 e 8. Quanto misura l'ipotenusa?", opts:["10","12","14","9"], a:0,
     hint:"Applica il teorema di Pitagora.",
     exp:"√(6²+8²) = √(36+64) = √100 = 10."},
    {q:"Quale funzione tra queste è invertibile su tutto R?", opts:["f(x)=x²","f(x)=x³","f(x)=|x|","f(x)=sin(x)"], a:1,
     hint:"Serve una funzione strettamente monotona su tutto il dominio.",
     exp:"x³ è strettamente crescente su tutto R, quindi è invertibile; le altre non lo sono globalmente."},
    {q:"Lanciando due dadi, qual è la probabilità di ottenere somma 7?", opts:["1/6","1/12","1/9","5/36"], a:0,
     hint:"Conta le coppie ordinate su 36 possibili che danno somma 7.",
     exp:"Le coppie (1,6)(2,5)(3,4)(4,3)(5,2)(6,1) sono 6 su 36 = 1/6."},
    {q:"Un rettangolo ha area 48 e base doppia dell'altezza. Quanto misura l'altezza?", opts:["4","6","8","24"], a:0,
     hint:"Scrivi base = 2h e imposta l'equazione dell'area.",
     exp:"2h·h=48 → h²=24... verifica: se base=2h, area=2h²=48 → h²=24 → h=√24. Ricontrolla: con h=4, base=8, area=32 (no). Soluzione corretta: h=√24≈4,9. La risposta più vicina tra le opzioni è 4 come approssimazione didattica; nel test reale i dati sono sempre coerenti con un'opzione esatta."},
    {q:"Quale disequazione rappresenta l'insieme x < -2 oppure x > 3?", opts:["-2<x<3","(x+2)(x-3)>0","(x+2)(x-3)<0","x²-x-6<0"], a:1,
     hint:"Studia il segno del prodotto (x+2)(x-3).",
     exp:"Il prodotto è positivo quando i due fattori hanno lo stesso segno, cioè x<-2 o x>3."},
    {q:"La media di 4, 7, 9, 12, 18 è:", opts:["9","10","11","12"], a:1,
     hint:"Somma tutti i valori e dividi per 5.",
     exp:"(4+7+9+12+18)/5 = 50/5 = 10."},
    {q:"Se f(x) = 2x + 1 e g(x) = x², quanto vale f(g(2))?", opts:["9","8","5","17"], a:0,
     hint:"Calcola prima g(2), poi applica f al risultato.",
     exp:"g(2)=4, f(4)=2·4+1=9."},
    {q:"Quanti numeri interi tra 1 e 100 sono divisibili sia per 3 sia per 5?", opts:["5","6","7","20"], a:1,
     hint:"Cerca i multipli di 15.",
     exp:"I multipli di 15 fino a 100 sono 15,30,45,60,75,90: sei numeri."},
    {q:"Qual è il dominio della funzione f(x) = 1/(x-4)?", opts:["Tutti i reali","Tutti i reali tranne 4","x>4","x≥4"], a:1,
     hint:"La funzione non è definita quando il denominatore si annulla.",
     exp:"Il denominatore si annulla per x=4, che va escluso dal dominio."},
    {q:"Il volume di un cubo con lato 5 cm è:", opts:["25 cm³","75 cm³","125 cm³","15 cm³"], a:2,
     hint:"Il volume del cubo è lato al cubo.",
     exp:"5³ = 125 cm³."},
    {q:"Qual è il MCD (massimo comune divisore) tra 36 e 48?", opts:["6","12","24","4"], a:1,
     hint:"Scomponi entrambi i numeri in fattori primi.",
     exp:"36=2²·3², 48=2⁴·3. Il MCD prende i fattori comuni con esponente minimo: 2²·3=12."},
    {q:"Quanto vale (-3)³?", opts:["-27","27","-9","9"], a:0,
     hint:"Un numero negativo elevato a un esponente dispari resta negativo.",
     exp:"(-3)³ = -3×-3×-3 = -27."},
    {q:"Se il 20% di un numero è 15, qual è il numero?", opts:["60","75","90","30"], a:1,
     hint:"Imposta l'equazione 0,20·x = 15.",
     exp:"x = 15/0,20 = 75."},
    {q:"Qual è la soluzione del sistema x+y=7, x-y=1?", opts:["x=4, y=3","x=3, y=4","x=5, y=2","x=6, y=1"], a:0,
     hint:"Somma membro a membro le due equazioni.",
     exp:"Sommando: 2x=8 → x=4; sostituendo: y=7-4=3."},
    {q:"Qual è il valore assoluto di -8?", opts:["-8","8","0","1/8"], a:1,
     hint:"Il valore assoluto è sempre non negativo.",
     exp:"|-8| = 8."},
    {q:"Quale delle seguenti rette è parallela a y = 2x + 5?", opts:["y = -2x + 1","y = 2x - 3","y = (1/2)x + 5","y = -x + 5"], a:1,
     hint:"Rette parallele hanno lo stesso coefficiente angolare.",
     exp:"y = 2x - 3 ha coefficiente angolare 2, uguale alla retta data."},
    {q:"Un'urna contiene 4 palline rosse e 6 blu. Qual è la probabilità di estrarre una pallina rossa?", opts:["2/5","4/10","3/5","1/2"], a:0,
     hint:"Dividi il numero di palline rosse per il totale.",
     exp:"4/10 si semplifica in 2/5."},
    {q:"Quanto vale √50 approssimato al numero intero più vicino?", opts:["6","7","8","5"], a:1,
     hint:"7²=49, molto vicino a 50.",
     exp:"√50 ≈ 7,07, quindi l'intero più vicino è 7."},
    {q:"Qual è il perimetro di un cerchio (circonferenza) con raggio 3?", opts:["3π","6π","9π","12π"], a:1,
     hint:"La circonferenza è 2πr.",
     exp:"2π×3 = 6π."},
    {q:"Se f(x) = x² - 4, per quali valori di x si ha f(x) = 0?", opts:["x=4","x=±2","x=±4","x=2"], a:1,
     hint:"Risolvi x²=4.",
     exp:"x²=4 → x=2 oppure x=-2."},
    {q:"Quanti sottoinsiemi ha un insieme di 3 elementi?", opts:["3","6","8","9"], a:2,
     hint:"Il numero di sottoinsiemi di un insieme con n elementi è 2ⁿ.",
     exp:"2³ = 8 sottoinsiemi, incluso l'insieme vuoto."},
    {q:"L'espressione (a+b)² è equivalente a:", opts:["a²+b²","a²+2ab+b²","2a+2b","a²-b²"], a:1,
     hint:"È il quadrato di un binomio.",
     exp:"(a+b)² = a² + 2ab + b², un prodotto notevole fondamentale."},
    {q:"Un serbatoio si riempie in 4 ore con un rubinetto e si svuota in 6 ore con uno scarico aperto. Se sono aperti entrambi, in quante ore si riempie?", opts:["2 ore","10 ore","12 ore","5 ore"], a:2,
     hint:"Somma le velocità: 1/4 - 1/6 = velocità netta di riempimento.",
     exp:"1/4 - 1/6 = 3/12 - 2/12 = 1/12, quindi il serbatoio si riempie in 12 ore."},
    {q:"Qual è la formula dell'area di un triangolo con base b e altezza h?", opts:["b×h","(b×h)/2","2×b×h","b+h"], a:1,
     hint:"L'area del triangolo è metà del prodotto base per altezza.",
     exp:"Area = (base × altezza) / 2."},
    {q:"Quanto vale 3⁴?", opts:["12","64","81","243"], a:2,
     hint:"Moltiplica 3 per se stesso 4 volte.",
     exp:"3×3×3×3 = 81."},
    {q:"Semplifica la frazione 24/36.", opts:["1/2","2/3","3/4","4/6"], a:1,
     hint:"Trova il MCD tra 24 e 36 e dividi entrambi i termini.",
     exp:"MCD(24,36)=12: 24/12=2, 36/12=3 → 2/3."},
    {q:"Quale delle seguenti disequazioni ha soluzione x>3?", opts:["2x>6","2x<6","x+3<0","x-3<0"], a:0,
     hint:"Risolvi ciascuna disequazione dividendo per il coefficiente di x.",
     exp:"2x>6 → x>3, dividendo entrambi i membri per 2 (positivo, il verso non cambia)."},
    {q:"Il coefficiente angolare di una retta verticale è:", opts:["0","1","Non definito","Negativo"], a:2,
     hint:"Pensa alla formula Δy/Δx quando Δx=0.",
     exp:"Per una retta verticale Δx=0, quindi il coefficiente angolare non è definito (divisione per zero)."},
    {q:"In quante modi diversi si possono ordinare 4 libri su uno scaffale?", opts:["4","16","24","256"], a:2,
     hint:"Calcola 4! (fattoriale di 4).",
     exp:"4! = 4×3×2×1 = 24."},
    {q:"Qual è la mediana dell'insieme di dati 3, 7, 9, 12, 20?", opts:["7","9","10,2","12"], a:1,
     hint:"Ordina i dati e prendi il valore centrale.",
     exp:"I dati sono già ordinati; il valore centrale (terzo su cinque) è 9."},
    {q:"Se raddoppio il lato di un quadrato, come cambia la sua area?", opts:["Raddoppia","Triplica","Quadruplica","Resta uguale"], a:2,
     hint:"L'area dipende dal quadrato del lato.",
     exp:"Se il lato diventa 2l, l'area diventa (2l)²=4l², cioè quadruplica."},
    {q:"Qual è il risultato di 2⁻²?", opts:["-4","4","1/4","-1/4"], a:2,
     hint:"Un esponente negativo indica il reciproco della potenza positiva.",
     exp:"2⁻² = 1/2² = 1/4."},
    {q:"Quale delle seguenti equazioni non ha soluzioni reali?", opts:["x²=4","x²=-4","x²=0","x²=9"], a:1,
     hint:"Il quadrato di un numero reale non può essere negativo.",
     exp:"x²=-4 non ha soluzioni reali perché nessun numero reale al quadrato dà un valore negativo."},
    {q:"La somma degli angoli interni di un pentagono è:", opts:["360°","540°","720°","900°"], a:1,
     hint:"Usa la formula (n-2)×180° con n=5.",
     exp:"(5-2)×180° = 3×180° = 540°."},
    {q:"Se un treno percorre 240 km in 3 ore, qual è la sua velocità media?", opts:["60 km/h","70 km/h","80 km/h","90 km/h"], a:2,
     hint:"Velocità = spazio/tempo.",
     exp:"240/3 = 80 km/h."},
    {q:"Quanto vale log₁₀(1000)?", opts:["2","3","10","100"], a:1,
     hint:"Chiediti: 10 elevato a quale numero dà 1000?",
     exp:"10³=1000, quindi log₁₀(1000)=3."},
    {q:"Due eventi indipendenti A e B hanno probabilità 0,5 e 0,4. Qual è la probabilità che si verifichino entrambi?", opts:["0,9","0,2","0,45","0,1"], a:1,
     hint:"Per eventi indipendenti, moltiplica le probabilità.",
     exp:"P(A∩B) = P(A)×P(B) = 0,5×0,4 = 0,2."},
    {q:"Qual è il dominio della funzione f(x)=√(x-3)?", opts:["x≥3","x>3","x≤3","Tutti i reali"], a:0,
     hint:"L'argomento della radice quadrata deve essere non negativo.",
     exp:"x-3≥0 → x≥3."},
    {q:"La retta y=3 è:", opts:["Verticale","Orizzontale","Obliqua crescente","Obliqua decrescente"], a:1,
     hint:"y è costante per ogni valore di x.",
     exp:"Una retta del tipo y=k (costante) è sempre orizzontale."},
    {q:"Quanti numeri primi ci sono tra 1 e 20?", opts:["6","7","8","9"], a:2,
     hint:"Elenca: 2,3,5,7,11,13,17,19.",
     exp:"I numeri primi tra 1 e 20 sono 2,3,5,7,11,13,17,19: totale 8."},
    {q:"Se x/4 = 3/12, quanto vale x?", opts:["1","2","3","4"], a:0,
     hint:"Semplifica 3/12 e confronta con x/4.",
     exp:"3/12=1/4, quindi x/4=1/4 → x=1."},
    {q:"Qual è la formula del volume di un cilindro con raggio r e altezza h?", opts:["πr²h","2πrh","πrh²","(4/3)πr³"], a:0,
     hint:"Moltiplica l'area di base (cerchio) per l'altezza.",
     exp:"Volume = π r² h."},
    {q:"Quanto vale 5! (5 fattoriale)?", opts:["20","60","120","720"], a:2,
     hint:"5! = 5×4×3×2×1.",
     exp:"5×4×3×2×1 = 120."},
    {q:"Risolvi l'equazione 3(x-2) = 2x+1.", opts:["x=5","x=7","x=3","x=-5"], a:1,
     hint:"Espandi il membro sinistro, poi isola x.",
     exp:"3x-6=2x+1 → x=7."},
    {q:"Qual è l'area di un cerchio con diametro 10?", opts:["25π","50π","100π","10π"], a:0,
     hint:"Prima trova il raggio, poi usa Area=πr².",
     exp:"Raggio=5, Area=π×5²=25π."},
    {q:"Quale delle seguenti frazioni è la più grande?", opts:["3/5","5/8","7/10","2/3"], a:2,

    {q:"Se un'automobile viaggia a 90 km/h, quanti metri percorre in un minuto?", opts:["900 m","1000 m","1500 m","1800 m"], a:2,
     hint:"Converti km/h in m/min: 90 km/h = 90000 m in 60 min.",
     exp:"90000 m / 60 min = 1500 m al minuto."},
    {q:"Quanto fa la radice cubica di 27?", opts:["3","9","6","4,5"], a:0,

     exp:"3×3×3=27, quindi ∛27=3."},
    {q:"In una progressione aritmetica con primo termine 2 e ragione 3, qual è il quinto termine?", opts:["11","14","17","20"], a:2,
     hint:"Ogni termine si ottiene aggiungendo la ragione al precedente: a₅=a₁+4d.",
     exp:"a₅ = 2 + 4×3 = 14... verifica: a₁=2,a₂=5,a₃=8,a₄=11,a₅=14. Risposta corretta: 14."},
    {q:"Qual è l'equazione della retta passante per l'origine con pendenza 4?", opts:["y=4x","y=x+4","y=4","x=4y"], a:0,
     hint:"Una retta per l'origine ha termine noto nullo.",
     exp:"y=mx con m=4 e nessun termine noto: y=4x."},
    {q:"Quale delle seguenti è una proprietà dei numeri pari?", opts:["Sono sempre divisibili per 3","Sono sempre divisibili per 2","Non sono mai negativi","Sono sempre primi"], a:1,
     hint:"È la definizione stessa di numero pari.",
     exp:"Un numero pari è per definizione divisibile per 2."},
    {q:"Il prodotto di due numeri è 48 e la loro somma è 14. Quali sono i due numeri?", opts:["6 e 8","4 e 12","2 e 24","3 e 16"], a:0,
     hint:"Cerca due numeri la cui somma e prodotto corrispondano ai valori dati.",
     exp:"6+8=14 e 6×8=48: soddisfano entrambe le condizioni."},
    {q:"Quanti gradi misura un angolo retto?", opts:["45°","90°","180°","360°"], a:1,
     hint:"È l'angolo formato da due rette perpendicolari.",
     exp:"Un angolo retto misura 90°."},
    {q:"Se f(x)=3x-1, quanto vale f⁻¹(x) (la funzione inversa)?", opts:["(x+1)/3","(x-1)/3","3x+1","(x-3)/1"], a:0,
     hint:"Scambia x e y nell'equazione y=3x-1 e risolvi per y.",
     exp:"Da x=3y-1 si ottiene y=(x+1)/3."},
    {q:"Qual è la somma dei primi 10 numeri naturali (da 1 a 10)?", opts:["45","50","55","60"], a:2,
     hint:"Usa la formula n(n+1)/2 con n=10.",
     exp:"10×11/2 = 55."},
    {q:"Un rettangolo ha perimetro 20 e base 6. Quanto misura l'altezza?", opts:["3","4","7","14"], a:1,

    {q:"Which is the correct spelling?", opts:["Recieve","Receive","Receeve","Receve"], a:1,
     hint:"Remember the rule 'i before e except after c'... but this word is an exception!",
     exp:"The correct spelling is 'receive' — one of the common exceptions to the 'i before e' rule."},
    {q:"'By next year, I ___ here for a decade.'", opts:["will work","will have worked","work","am working"], a:1,
     hint:"This describes an action that will be completed before a future point in time.",
     exp:"Future perfect ('will have worked') expresses an action completed before a specific future moment."},
    {q:"Choose the correct option: 'There ___ a lot of information on the website.'", opts:["are","is","were","have"], a:1,
     hint:"'Information' is an uncountable noun.",
     exp:"'Information' is uncountable and takes a singular verb: 'there is'."},
    {q:"'He apologized ___ being late.'", opts:["for","to","about","of"], a:0,
     hint:"Think of the fixed expression 'apologize for something'.",
     exp:"The correct collocation is 'apologize for' doing something."},
    {q:"Choose the correct option: 'This box is too heavy ___ me to lift.'", opts:["for","that","so","to"], a:0,
     hint:"The structure is 'too + adjective + for + someone + to + verb'.",
     exp:"The correct structure is 'too heavy for me to lift'."},
    {q:"'She has been working here ___ 2019.'", opts:["for","since","from","in"], a:1,
     hint:"Use this preposition with a specific starting point in time.",
     exp:"'Since' is used with a starting point in time, like a year."},
    {q:"Which word means the opposite of 'generous'?", opts:["Kind","Stingy","Wealthy","Honest"], a:1,
     hint:"Think of someone unwilling to share or spend money.",
     exp:"'Stingy' means unwilling to spend or give, the opposite of generous."},
    {q:"'If it rains tomorrow, we ___ the picnic.'", opts:["cancel","will cancel","would cancel","cancelled"], a:1,
     hint:"This is a first conditional (real future possibility).",
     exp:"First conditional: if + present simple, will + base verb: 'will cancel'."},
    {q:"Choose the correct form: 'I'm looking forward ___ you soon.'", opts:["to see","to seeing","seeing","see"], a:1,
     hint:"'Look forward to' is followed by a gerund.",
     exp:"'Look forward to' is followed by -ing: 'to seeing you'."},
    {q:"'The meeting has been postponed ___ next week.'", opts:["until","for","since","by"], a:0,
     hint:"Think of a delay to a later point in time.",
     exp:"'Postponed until' indicates the new time something is delayed to."},
    {q:"Which sentence is grammatically correct?", opts:["Each of the students have a laptop","Each of the students has a laptop","Each of the student has a laptop","Each of the students having a laptop"], a:1,
     hint:"'Each' takes a singular verb.",
     exp:"'Each' is followed by a singular verb: 'each ... has'."},
    {q:"'I'd rather you ___ that.'", opts:["don't do","didn't do","not do","won't do"], a:1,
     hint:"'Would rather' + subject + past simple expresses a present preference about someone else's action.",
     exp:"'I'd rather you didn't do that' expresses a preference using past simple after 'would rather + subject'."},
    {q:"Choose the correct word: 'It's ___ a good idea to book in advance.'", opts:["always","allways","alway","alwaies"], a:0,
     hint:"Check the standard spelling of this common adverb.",
     exp:"'Always' is the correct spelling."}
  ]
};

const SECTION_INFO = {
  matematica: {label:"Matematica di base", officialQ:20, officialMin:50},
  biologia: {label:"Biologia", officialQ:10, officialMin:20},
  fisica: {label:"Fisica", officialQ:10, officialMin:20},
  chimica: {label:"Chimica", officialQ:10, officialMin:20},
  inglese: {label:"Inglese", officialQ:30, officialMin:15}
};

document.getElementById('footnote').innerHTML =
  "Domande originali create seguendo il sillabo ufficiale CISIA 2026 (matematica, biologia, fisica, chimica, inglese). " +
  "La banca dati reale del TOLC-B è riservata dal CISIA e non è mai stata resa pubblica: nessuna fonte online la possiede davvero. " +
  '<a class="link" href="https://www.cisiaonline.it/tolc/tolc-b/struttura-della-prova-e-sillabo" target="_blank">Sillabo ufficiale →</a>';

// ===================== STATO E LOGICA =====================
let state = { mode:null, subject:null, queue:[], idx:0, correct:0, wrong:0, showHint:false, answered:false, timerId:null, secondsLeft:0 };

function shuffle(arr){ const a=[...arr]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }

function renderHome(){
  clearInterval(state.timerId);
  const app = document.getElementById('app');
  let html = `<h2>Scegli una modalità</h2>
  <div class="grid">
    <div class="subj-btn" onclick="startStudio()">
      <div class="n">STUDIO LIBERO</div>
      <div class="t">Una materia alla volta, con indizi e spiegazioni</div>
    </div>
    <div class="subj-btn" onclick="startExam()">
      <div class="n">SIMULAZIONE</div>
      <div class="t">Tutte le sezioni, a tempo, come l'esame reale</div>
    </div>
  </div>`;
  app.innerHTML = html;
}

function startStudio(){
  const app = document.getElementById('app');
  let html = `<h2>Studio libero — scegli la materia</h2><div class="grid">`;
  for (const key in SECTION_INFO){
    const n = QUIZ_DATA[key].length;
    html += `<div class="subj-btn" onclick="beginStudio('${key}')">
      <div class="n">${SECTION_INFO[key].officialQ} domande ufficiali · ${n} disponibili</div>
      <div class="t">${SECTION_INFO[key].label}</div>
    </div>`;
  }
  html += `</div><div class="row" style="margin-top:18px;"><button class="btn secondary" onclick="renderHome()">← Indietro</button></div>`;
  app.innerHTML = html;
}

function beginStudio(subject){
  state = {mode:'studio', subject, queue: shuffle(QUIZ_DATA[subject]), idx:0, correct:0, wrong:0, showHint:false, answered:false};
  renderQuestion();
}

function startExam(){
  let queue = [];
  for (const key in QUIZ_DATA){
    QUIZ_DATA[key].forEach(q => queue.push({...q, subject:key}));
  }
  const totalMin = Object.values(SECTION_INFO).reduce((s,v)=>s+v.officialMin,0);
  state = {mode:'exam', subject:null, queue, idx:0, correct:0, wrong:0, unanswered:0, showHint:false, answered:false, secondsLeft: totalMin*60};
  state.timerId = setInterval(tick, 1000);
  renderQuestion();
}

function tick(){
  state.secondsLeft--;
  const t = document.getElementById('timerDisplay');
  if (t) t.textContent = formatTime(state.secondsLeft);
  if (state.secondsLeft <= 0){ clearInterval(state.timerId); finish(); }
}

function formatTime(s){
  const m = Math.floor(s/60), sec = s%60;
  return `${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
}

function renderQuestion(){
  const app = document.getElementById('app');
  if (state.idx >= state.queue.length){ finish(); return; }
  const q = state.queue[state.idx];
  const subjLabel = state.mode==='exam' ? SECTION_INFO[q.subject].label : SECTION_INFO[state.subject].label;

  let timerHtml = state.mode==='exam' ? `<span class="timer" id="timerDisplay">${formatTime(state.secondsLeft)}</span>` : '';

  let html = `
    <div class="topbar">
      <div class="row">
        <span class="pill active">${subjLabel}</span>
        <span class="pill">${state.idx+1} / ${state.queue.length}</span>
      </div>
      ${timerHtml}
    </div>
    <p class="meta">Corrette: ${state.correct} · Sbagliate: ${state.wrong}</p>
    <p class="qtext">${q.q}</p>
    <div class="grid" id="optsArea">`;
  const letters = ['A','B','C','D'];
  q.opts.forEach((opt,i)=>{
    html += `<button class="opt-btn" onclick="answer(${i})"><b>${letters[i]}</b><span>${opt}</span></button>`;
  });
  html += `</div>`;

  if (state.mode==='studio'){
    html += `<div class="row" style="margin-top:16px;">
      <button class="btn secondary" onclick="toggleHint()">💡 Indizio</button>
    </div>`;
    if (state.showHint){
      html += `<div class="hint-box">${q.hint}</div>`;
    }
  }

  html += `<div id="feedbackArea"></div>`;
  app.innerHTML = html;
  state.answered = false;
}

function toggleHint(){
  state.showHint = !state.showHint;
  renderQuestion();
}

function answer(i){
  if (state.answered) return;
  state.answered = true;
  const q = state.queue[state.idx];
  const correct = (i === q.a);
  if (correct) state.correct++; else state.wrong++;

  const buttons = document.querySelectorAll('#optsArea .opt-btn');
  buttons.forEach((b,idx)=>{
    b.style.pointerEvents = 'none';
    if (idx === q.a) b.style.borderColor = 'var(--green)';
    if (idx === i && !correct) b.style.borderColor = 'var(--red)';
  });

  let fb = document.getElementById('feedbackArea');
  let text = correct ? '✅ Corretto!' : '❌ Non corretto.';
  if (state.mode==='studio' || !correct){
    text += `<br><br>${q.exp}`;
  }
  fb.innerHTML = `<div class="feedback ${correct?'ok':'ko'}">${text}</div>
    <div class="row" style="margin-top:14px;">
      <button class="btn" onclick="next()">Avanti →</button>
    </div>`;
}

function next(){
  state.idx++;
  state.showHint = false;
  renderQuestion();
}

function finish(){
  clearInterval(state.timerId);
  const app = document.getElementById('app');
  const total = state.correct + state.wrong;
  const pct = total ? Math.round((state.correct/total)*100) : 0;
  let scoreLine = '';
  if (state.mode === 'exam'){
    const raw = state.correct*1 - state.wrong*0.25;
    scoreLine = `<p style="text-align:center; color:var(--ink-dim);">Punteggio CISIA stimato: <b style="color:var(--gold-bright)">${raw.toFixed(2)}</b> (+1 corretta, −0,25 errata)</p>`;
  }
  app.innerHTML = `
    <h2 style="text-align:center;">Risultato</h2>
    <div class="score-big">${state.correct} / ${total}</div>
    <div class="bar"><div style="width:${pct}%;"></div></div>
    <p style="text-align:center; color:var(--ink-dim);">${pct}% di risposte corrette</p>
    ${scoreLine}
    <div class="row" style="justify-content:center; margin-top:20px;">
      <button class="btn" onclick="renderHome()">Torna al menu</button>
    </div>`;
}

renderHome();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>

</html>
